name: 'Good Morning composite action'
description: "greets a user and print composite action"
# Define inputs that the action accepts
inputs:
  person:
    description: 'Who to greet'
    required: true
    default: 'World'
 #Define outputs if you want to pass data back to the workflow
outputs:
  greeting-status:
    description: 'The status of the greeting'
    value: ${{ steps.set-status.outputs.status }}   
runs:
  using: 'composite' # Tells GitHub this is a composite action
  steps:
    - name: Print Greeting
      run: echo "Good Morning, ${{ inputs.person }}!"
      shell: bash # Explicit shell required for composite actions
  
    - name: set Output Status
      id: set-status
      run: echo "status=success" >> $GITHUB_OUTPUT
      shell: bash


