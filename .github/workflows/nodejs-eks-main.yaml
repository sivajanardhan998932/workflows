
name: nodejs-eks-main

on:
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to: dev, sit, uat or prod"'
        required: true
        type: string
      commit_id:
        description: 'Commit SHA to promote (required for sit/uat/prod)'
        required: false
        type: string
        default: ''  
      version:
        description: 'Release version to tag the commit with on a successful prod deploy, e.g. v1.4.0 (required for prod deploy)'
        required: false
        type: string
        default: 
    secrets:
      GH_PAT:
        required: true 
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
  aws_region: us-east-1
  acc_id: "209115427888"
  registry: 209115427888.dkr.ecr.us-east-1.amazonaws.com
  org: sivajanardhan998932

  

jobs:
  dev-deploy:
    name: Verify merged code in dev
    if: ${{ inputs.environment == 'dev' }}

    runs-on:
      group: roboshop
      labels: nodejs-dev

    environment: ${{ inputs.environment }}

    permissions:
      statuses: write

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: read version 
        id: version
        run: echo "app_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      
      - name: dev-deploy
        id: dev-deploy
        run: |
          set -e
          aws eks update-kubeconfig --name roboshop --region ${aws_region}

          helm upgrade --install ${component} ./helm \
            -f ./helm/values-dev.yaml \
            --namespace roboshop-dev \
            --create-namespace \
            --set deployment.imageVersion=${{ steps.version.outputs.app_version }} \
            --wait --timeout 5m

          kubectl rollout status deployment/${component} -n roboshop-dev --timeout=120s
      - name: status-dev-deploy
        if: always() && (steps.dev-deploy.outcome == 'success' || steps.dev-deploy.outcome == 'failure')
        uses: sivajanardhan998932/workflows/.github/actions/commit-status@main
        with:
          state: ${{ steps.dev-deploy.outcome }}
          context: dev-deploy
          description: ${{ steps.dev-deploy.outcome == 'success' && 'Deployed to roboshop-dev' || 'Deploy to roboshop-dev failed' }}
          token: ${{ github.token }}
      - name: api-tests
        id: api-tests
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          gh workflow run api-tests.yaml \
            --repo ${org}/catalogue-api-tests \
            --ref main \
            -f namespace=roboshop-dev \
            -f commit_id=${{ github.sha }}

          sleep 10
          run_id=$(gh run list --repo ${org}/catalogue-api-tests --workflow=api-tests.yaml --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId')
          echo "watching catalogue-api-tests run $run_id"
          gh run watch "$run_id" --repo ${org}/catalogue-api-tests --exit-status
      - name: status-api-tests
        if: always() && (steps.api-tests.outcome == 'success' || steps.api-tests.outcome == 'failure')
        uses: sivajanardhan998932/workflows/.github/actions/commit-status@main
        with:
          state: ${{ steps.api-tests.outcome }}
          context: api-tests
          description: ${{ steps.api-tests.outcome == 'success' && 'catalogue-api-tests passed' || 'catalogue-api-tests failed' }}
          token: ${{ github.token }}      
    
